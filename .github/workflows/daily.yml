name: Daily YouTube Shorts Auto-Publisher

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST
    - cron: '30 3 * * *'
    # 14:00 UTC = 07:30 PM IST
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the video (leave empty to use topics.txt queue)'
        required: false
        type: string
      publish:
        description: 'Upload to YouTube? false = artifact download only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: autoshorts-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: whisper-cache-v3-${{ runner.os }}-py311

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Do this BEFORE an 8-10 minute render. invalid_grant is permanent until
      # YOUTUBE_REFRESH_TOKEN is replaced, so rendering first only wastes time.
      - name: Preflight YouTube OAuth (publish runs only)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PYTHONPATH: .
        run: python -m src.uploader --check-auth

      - name: Run AutoShorts Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || vars.PIXABAY_API_KEY }}
          WHISPER_MODEL: ${{ secrets.WHISPER_MODEL || vars.WHISPER_MODEL || 'tiny.en' }}
          WHISPER_DEVICE: cpu
          WHISPER_COMPUTE_TYPE: int8
          CAPTION_LEAD_SECONDS: '0.0'
          ENABLE_ANALYTICS_SYNC: 'false'
          MIN_NARRATION_WORDS: '95'
          TARGET_NARRATION_WORDS: '108'
          TARGET_MIN_NARRATION_WORDS: '100'
          TARGET_MAX_NARRATION_WORDS: '125'
          MIN_FINAL_DURATION_SECONDS: '30'
          MAX_FINAL_DURATION_SECONDS: '58'
          PYTHONPATH: .
          WORKFLOW_TOPIC: ${{ inputs.topic || '' }}
          WORKFLOW_PUBLISH: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail
          ARGS=()

          if [ -n "${WORKFLOW_TOPIC:-}" ]; then
            ARGS+=(--topic "$WORKFLOW_TOPIC")
          else
            ARGS+=(--topics-file "topics.txt")
          fi

          # Scheduled runs publish. Manual runs upload only when publish=true.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${WORKFLOW_PUBLISH}" != "true" ]; then
            ARGS+=(--no-upload)
          fi

          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "topic_input=${WORKFLOW_TOPIC:-<queue>}"
          echo "publish_input=${WORKFLOW_PUBLISH}"
          printf 'command=python src/main.py'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          python src/main.py "${ARGS[@]}"

      - name: Final debug summary
        if: always()
        run: |
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "topic_input=${{ inputs.topic || '' }}"
          echo "publish_input=${{ inputs.publish || false }}"
          if [ -f output/final_short.mp4 ]; then
            echo "final_short_exists=true"
            ls -lh output/final_short.mp4
            echo -n "final_duration_seconds="
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/final_short.mp4 || true
          else
            echo "final_short_exists=false"
          fi
          if [ -f output/metadata.json ]; then
            echo "metadata.json:"
            cat output/metadata.json
          fi

      # Manual publish=false always gets a review artifact. A publish failure after
      # rendering also gets a recovery artifact so the completed MP4 is not lost.
      - name: Upload review or recovery artifact
        if: ${{ always() && (failure() || (github.event_name == 'workflow_dispatch' && !inputs.publish)) }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-${{ github.run_number }}
          path: |
            autoshorts-pipeline/output/final_short.mp4
            autoshorts-pipeline/output/narration_final.mp3
            autoshorts-pipeline/output/metadata.json
            autoshorts-pipeline/output/audio_timing_report.json
            autoshorts-pipeline/output/caption_timing_report.json
            autoshorts-pipeline/output/debug_contact_sheet.jpg
            autoshorts-pipeline/output/captions.json
            autoshorts-pipeline/output/caption_sample_*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Commit queue updates
        if: ${{ success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.topic == '' || inputs.topic == null))) }}
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add topics.txt topic_bank.json topic_state.json analytics_history.json niche_scores.json upload_history.json || true
          if ! git diff --quiet --cached; then
            git commit -m "chore: update topics queue"
            git push || echo "::warning::Write access not granted. Enable Settings > Actions > Workflow permissions > Read and write."
          else
            echo "No queue changes to commit."
          fi
