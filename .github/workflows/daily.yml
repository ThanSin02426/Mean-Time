name: Daily YouTube Shorts Auto-Publisher

on:
  schedule:
    # Runs at 14:00 UTC every day
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the video (leave empty to pick randomly from topics.txt)'
        required: false
        type: string
      publish:
        description: 'Upload to YouTube?'
        required: false
        type: boolean
        default: false

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoshorts-pipeline

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        # Fix ImageMagick policy for moviepy TextClip
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-6/policy.xml || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run AutoShorts Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        PYTHONPATH: .
      run: |
        # Determine topic argument
        if [ "${{ github.event.inputs.topic }}" != "" ]; then
          TOPIC_ARG="--topic \"${{ github.event.inputs.topic }}\""
        else
          TOPIC_ARG="--topics-file topics.txt"
        fi

        # Determine publish argument (default is to publish if schedule, or if publish is true on dispatch)
        if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event.inputs.publish }}" == "true" ]; then
          PUBLISH_ARG=""
        else
          PUBLISH_ARG="--no-upload"
        fi

        # Run the command and evaluate it
        eval python src/main.py $TOPIC_ARG $PUBLISH_ARG

    - name: Debug Output Directory
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'false'
      run: |
        pwd
        ls -R
        find . -name "*.mp4" -type f

    - name: Upload Artifact (if not published)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: generated-short
        path: autoshorts-pipeline/output/final_short.mp4
        if-no-files-found: error

    - name: Commit queue updates
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.topic == '')
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add topics.txt
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "chore: update topics queue"
        git push
