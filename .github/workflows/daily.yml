name: Daily YouTube Shorts Auto-Publisher

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST
    - cron: '30 3 * * *'
    # 14:00 UTC = 07:30 PM IST
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the video (leave empty to pick randomly from topics.txt)'
        required: false
        type: string
      publish:
        description: 'Upload to YouTube?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoshorts-pipeline

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Cache Whisper model
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/torch
        key: whisper-cache-v1-${{ runner.os }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
        # Fix ImageMagick policy for moviepy TextClip
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-6/policy.xml || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run AutoShorts Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || vars.PIXABAY_API_KEY }}
        WHISPER_MODEL: ${{ secrets.WHISPER_MODEL || vars.WHISPER_MODEL || 'tiny.en' }}
        WHISPER_DEVICE: cpu
        WHISPER_COMPUTE_TYPE: int8
        PYTHONPATH: .
        WORKFLOW_TOPIC: ${{ github.event.inputs.topic }}
      run: |
        ARGS=()

        # Determine topic argument
        if [ -n "$WORKFLOW_TOPIC" ]; then
          ARGS+=(--topic "$WORKFLOW_TOPIC")
        else
          ARGS+=(--topics-file "topics.txt")
        fi

        # Determine publish argument (default is to publish if schedule, or if publish is true on dispatch)
        if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.publish }}" != "true" ]; then
          ARGS+=(--no-upload)
        fi

        # Run the command securely
        python src/main.py "${ARGS[@]}"

    - name: Upload Artifacts (if not published)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: generated-short
        path: |
          autoshorts-pipeline/output/final_short.mp4
          autoshorts-pipeline/output/metadata.json
          autoshorts-pipeline/output/debug_contact_sheet.jpg
          autoshorts-pipeline/output/captions.json
          autoshorts-pipeline/output/caption_sample_*.png
        if-no-files-found: error

    - name: Commit queue updates
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.topic == '')
      continue-on-error: true
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add topics.txt
        # Only commit if there are changes
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "chore: update topics queue"
          git push || echo "::warning::Write access to repository not granted. Please enable Read and write permissions in GitHub Settings."
        fi
