name: AutoShorts Publisher

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Manual topic; leave empty for queue mode'
        required: false
        type: string
      publish:
        description: 'Upload to YouTube after all quality gates pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: autoshorts-queue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: autoshorts-pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: autoshorts-pipeline/requirements.txt

      - name: Cache Whisper models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ctranslate2
          key: whisper-${{ runner.os }}-py311-base-small-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve effective publish mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          AUTOPUBLISH_ENABLED: ${{ vars.AUTOPUBLISH_ENABLED }}
        run: |
          publish=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "${AUTOPUBLISH_ENABLED,,}" = "true" ]; then
              publish=true
            fi
          elif [ "${MANUAL_PUBLISH,,}" = "true" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "Effective publish mode: $publish"

      - name: Preflight YouTube OAuth
        if: steps.mode.outputs.publish == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PYTHONPATH: .
        run: python -m src.uploader --check-auth

      - name: Run production pipeline
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          WHISPER_MODEL: base.en
          WHISPER_FALLBACK_MODEL: small.en
          WHISPER_DEVICE: cpu
          WHISPER_COMPUTE_TYPE: int8
          ENABLE_ANALYTICS: 'false'
          PYTHONPATH: .
          INPUT_TOPIC: ${{ inputs.topic }}
          EFFECTIVE_PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          args=()
          if [ -n "${INPUT_TOPIC:-}" ]; then
            args+=(--topic "$INPUT_TOPIC")
          fi
          if [ "$EFFECTIVE_PUBLISH" = "true" ]; then
            args+=(--publish)
          fi
          python -m src.main "${args[@]}"

      - name: Read queue transaction state
        if: always()
        id: queue_state
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('output/run_manifest.json')
          data = json.loads(path.read_text()) if path.exists() else {}
          tx = data.get('queue_transaction_status', {})
          print(f"source={tx.get('source', '')}")
          print(f"status={tx.get('status', '')}")
          print(f"transaction_id={tx.get('transaction_id', '')}")
          PY

      - name: Commit and push transactional queue state
        id: queue_push
        if: success() && steps.queue_state.outputs.source == 'queue' && steps.queue_state.outputs.status == 'finalized'
        shell: bash
        run: |
          set -euo pipefail
          git -C .. config user.email "github-actions[bot]@users.noreply.github.com"
          git -C .. config user.name "github-actions[bot]"
          git -C .. add \
            autoshorts-pipeline/topics.txt \
            autoshorts-pipeline/topic_state.json \
            autoshorts-pipeline/topic_bank.json \
            autoshorts-pipeline/queue_transaction.json \
            autoshorts-pipeline/upload_history.json
          if git -C .. diff --cached --quiet; then
            echo "status=no_changes" >> "$GITHUB_OUTPUT"
            echo "QUEUE COMMIT STATUS: no changes"
            exit 0
          fi
          git -C .. commit -m "chore: finalize AutoShorts queue transaction ${{ steps.queue_state.outputs.transaction_id }}"
          if git -C .. push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "status=pushed" >> "$GITHUB_OUTPUT"
            echo "GIT PUSH STATUS: pushed"
            exit 0
          fi
          echo "Initial push failed; pulling with rebase and retrying once."
          if git -C .. pull --rebase origin "$GITHUB_REF_NAME" && git -C .. push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "status=pushed_after_rebase" >> "$GITHUB_OUTPUT"
            echo "GIT PUSH STATUS: pushed_after_rebase"
            exit 0
          fi
          echo "status=failed" >> "$GITHUB_OUTPUT"
          cat > output/queue_push_failure.txt <<EOF
          Queue transaction finalized locally, but GitHub push failed after one rebase retry.
          Transaction: ${{ steps.queue_state.outputs.transaction_id }}
          Branch: ${GITHUB_REF_NAME}
          The generated/uploaded video is retained. Download this artifact and reconcile the queue files.
          EOF
          echo "::warning::Queue state could not be pushed after retry. Recovery files will be uploaded."

      - name: Upload review or recovery artifact
        if: always() && (steps.mode.outputs.publish != 'true' || failure() || steps.queue_push.outputs.status == 'failed')
        uses: actions/upload-artifact@v5
        with:
          name: autoshorts-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 10
          path: |
            autoshorts-pipeline/output/final_short.mp4
            autoshorts-pipeline/output/narration_final.wav
            autoshorts-pipeline/output/run_manifest.json
            autoshorts-pipeline/output/subtitle_alignment_report.json
            autoshorts-pipeline/output/aligned_words.json
            autoshorts-pipeline/output/caption_chunks.json
            autoshorts-pipeline/output/captions.ass
            autoshorts-pipeline/output/caption_debug_*.png
            autoshorts-pipeline/output/subtitle_test.mp4
            autoshorts-pipeline/output/whisper_words_*.json
            autoshorts-pipeline/output/visual_contact_sheet.jpg
            autoshorts-pipeline/output/visual_candidates.json
            autoshorts-pipeline/output/media_attribution.json
            autoshorts-pipeline/output/music_attribution.json
            autoshorts-pipeline/output/fact_check.json
            autoshorts-pipeline/output/quality_gate_report.json
            autoshorts-pipeline/output/queue_push_failure.txt
            autoshorts-pipeline/queue_transaction.json
            autoshorts-pipeline/topics.txt
            autoshorts-pipeline/topic_state.json
            autoshorts-pipeline/topic_bank.json

      - name: Write run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('output/run_manifest.json')
          if not path.exists():
              print('## AutoShorts run failed before a manifest was written')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          print('## AutoShorts run summary')
          print(f"- Status: **{data.get('status')}**")
          print(f"- Topic source: `{data.get('topic_source')}`")
          print(f"- Topic: {data.get('selected_topic')}")
          print(f"- Niche: `{data.get('niche')}`")
          print(f"- Narration: {data.get('narration_word_count')} words / {data.get('narration_duration')} seconds")
          print(f"- Final duration: {data.get('final_duration')} seconds")
          subtitle = data.get('subtitle_alignment_results', {})
          print(f"- Subtitle raw coverage: {subtitle.get('raw_coverage_ratio', 'n/a')}")
          print(f"- Subtitle final alignment: {subtitle.get('final_alignment_ratio', 'n/a')}")
          print(f"- Maximum active-speech caption gap: {subtitle.get('maximum_active_speech_caption_gap', 'n/a')} seconds")
          print(f"- Upload status: `{data.get('upload_status')}`")
          print(f"- YouTube URL: {data.get('youtube_url') or 'not uploaded'}")
          tx = data.get('queue_transaction_status', {})
          print(f"- Queue transaction: `{tx.get('status', 'unknown')}`")
          failed = [g['name'] for g in data.get('quality_gate_results', []) if g.get('required', True) and not g.get('passed')]
          print(f"- Failed required gates: {', '.join(failed) if failed else 'none'}")
          if data.get('errors'):
              print('- Errors: ' + ' | '.join(data['errors']))
          PY
