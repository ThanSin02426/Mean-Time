name: AutoShorts Tests

on:
  push:
    paths:
      - 'autoshorts-pipeline/**'
      - '.github/workflows/autoshorts-*.yml'
  pull_request:
    paths:
      - 'autoshorts-pipeline/**'
      - '.github/workflows/autoshorts-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: autoshorts-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: autoshorts-pipeline/requirements.txt
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Topic engine self-test
        env:
          PYTHONPATH: .
        run: python -m src.topic_engine --self-test
      - name: Run unit and smoke tests
        env:
          PYTHONPATH: .
        run: pytest -q
